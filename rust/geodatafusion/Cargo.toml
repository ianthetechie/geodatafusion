[package]
name = "geodatafusion"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Spatial extensions for Apache DataFusion"
categories = { workspace = true }
rust-version = { workspace = true }


[features]
# Enables GEOS-backed UDFs.
# We only use explicitly versioned flags,
# and the structure should be recursive
# (with higher version targets implying lower version ones
# in a chain.)
geos-3_11 = ["geos/v3_11_0", "dep:geoarrow-expr-geos"]
# GEOS 3.14 gained M-coordinate support, so geometries carrying an M dimension can
# round-trip through GEOS (where operations like ST_LineMerge still drop M, matching
# PostGIS). Without this, M-bearing inputs error during the GEOS conversion.
geos-3_14 = ["geos-3_11", "geos/v3_14_0", "geoarrow-expr-geos/geos-3_14"]

[dependencies]
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
datafusion = { workspace = true }
geo = { workspace = true }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true }
geoarrow-expr-geo = { workspace = true }
geoarrow-expr-geos = { workspace = true, optional = true }
geoarrow-schema = { workspace = true }
geohash = { workspace = true }
geos = { workspace = true, optional = true }
thiserror = { workspace = true }
wkt = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
datafusion = { workspace = true, features = ["sql"] }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true, features = ["test-data"] }
object_store = { workspace = true, features = ["http"] }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
